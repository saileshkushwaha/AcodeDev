name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  JAVA_VERSION: '17'
  ANDROID_SDK_ROOT: ${{ runner.env.ANDROID_SDK_ROOT || '/opt/hostedtoolcache/Android' }}
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g -Dorg.gradle.daemon=false -Dorg.gradle.parallel=true"

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          cmdline-tools-version: latest
          cache-key: android-sdk-${{ runner.os }}-${{ hashFiles('packages/web/android/gradle/**') }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache node modules
        uses: actions/cache@v4
        with:
          path: |
            packages/web/node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('packages/web/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install Node dependencies
        working-directory: packages/web
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Build web app
        working-directory: packages/web
        run: npm run build

      - name: Capacitor Sync
        working-directory: packages/web
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x packages/web/android/gradlew

      - name: Build Debug APK
        working-directory: packages/web/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: packages/web/android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: packages/web/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: packages/web/android/app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            packages/web/android/app/build/outputs/apk/release/*.apk
            packages/web/android/app/build/outputs/apk/debug/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment PR with APK link
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 10
            });
            const debugApk = artifacts.data.artifacts.find(a => a.name === 'app-debug');
            if (debugApk) {
              const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${debugApk.workflow_run_id}`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `📱 **Debug APK built successfully!**\n\nDownload: ${url}\n\n*This APK is valid for 30 days.*`
              });
            }

  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/web/package-lock.json

      - name: Install dependencies
        working-directory: packages/web
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run lint
        working-directory: packages/web
        run: npm run lint

      - name: Run typecheck
        working-directory: packages/web
        run: npm run typecheck

      - name: Run tests
        working-directory: packages/web
        run: npm run test

      - name: Build web
        working-directory: packages/web
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: packages/web/dist
          retention-days: 7

  deploy-preview:
    name: Deploy Preview
    needs: build-web
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: dist

      - name: Deploy to GitHub Pages (preview)
        uses: peaceiris/actions-gh-pages@v3
        if: github.repository == 'saileshkushwaha/AcodeDev'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: pr-${{ github.event.number }}
          keep_files: true
          force_orphan: true
          publish_branch: gh-pages

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
