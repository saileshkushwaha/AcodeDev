<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%237c6cff'/%3E%3Ctext x='16' y='22' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'%3EA%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5" />
    <meta name="description" content="AcodeDev - All-in-one AI studio and project management" />
    <meta name="theme-color" content="#0b0d12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>AcodeDev Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      @keyframes acode-spin { to { transform: rotate(360deg); } }
      @keyframes acode-fade-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes acode-rise {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes acode-scale-in {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes acode-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes acode-shimmer {
        0% { background-position: -400px 0; }
        100% { background-position: 400px 0; }
      }
      * { box-sizing: border-box; }
      html, body, #root { height: 100%; margin: 0; }
      body {
        margin: 0;
        font-family: var(--font-sans), Inter, -apple-system, sans-serif;
        background: var(--bg, #0b0d12);
        color: var(--text, #e6e9f0);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overscroll-behavior-y: none;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--text-muted, #6b7280) 35%, transparent); border-radius: 8px; border: 2px solid transparent; background-clip: content-box; }
      ::-webkit-scrollbar-thumb:hover { background-color: color-mix(in srgb, var(--text-muted, #6b7280) 55%, transparent); }
      code, pre { font-family: var(--font-mono), "JetBrains Mono", monospace; }
      button { font-family: inherit; }
      a { text-decoration: none; }

      .rise { animation: acode-rise 0.28s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
      .fade-in { animation: acode-fade-in 0.2s ease both; }
      .scale-in { animation: acode-scale-in 0.18s ease both; }
      .shimmer {
        background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--text, #e6e9f0) 6%, transparent), transparent);
        background-size: 800px 100%;
        animation: acode-shimmer 1.4s infinite linear;
      }
      @media (prefers-reduced-motion: reduce) {
        * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
